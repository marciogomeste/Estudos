<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema offline de estudos para o MPMG">
    <title>Sistema de Estudos - MPMG</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background-color: #eff6ff;
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        /* Esconde o input file original */
        input[type="file"] {
            display: none;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .add-form {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
        }

        @media (max-width: 640px) {
            .add-form {
                grid-template-columns: 1fr;
            }
        }

        input, select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            width: 100%;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-pendente { background: #fef3c7; color: var(--warning); }
        .badge-estudando { background: #dbeafe; color: var(--primary); }
        .badge-concluido { background: #dcfce7; color: var(--success); }

        .action-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel de Estudos - MPMG</h1>
        <p>Acompanhamento offline do edital do Ministério Público de Minas Gerais</p>
    </header>

    <div class="controls">
        <button class="btn" onclick="exportData()">💾 Salvar Backup (JSON)</button>
        <label for="importFile" class="btn btn-outline">📂 Importar Backup (JSON)</label>
        <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        <button class="btn btn-danger" style="margin-left: auto;" onclick="clearAllData()">🗑️ Limpar Tudo</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <h3>Total de Tópicos</h3>
            <div class="value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <h3>Concluídos</h3>
            <div class="value" id="statConcluidos" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
            <h3>Progresso Geral</h3>
            <div class="value" id="statProgresso">0%</div>
        </div>
    </div>

    <form class="add-form" id="studyForm" onsubmit="addTopic(event)">
        <input type="text" id="materiaInput" placeholder="Matéria / Tópico (ex: Direito Constitucional)" required>
        <select id="statusSelect">
            <option value="Pendente">Pendente</option>
            <option value="Em Estudo">Em Estudo</option>
            <option value="Concluído">Concluído</option>
        </select>
        <input type="number" id="horasInput" placeholder="Horas Dedicadas" min="0" step="0.5" value="0">
        <button type="submit" class="btn">Adicionar</button>
    </form>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Matéria / Tópico</th>
                    <th>Status</th>
                    <th>Horas</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="topicsTableBody">
                <!-- Tópicos inseridos via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const STORAGE_KEY = 'mpmg_estudos_data';

        // Dados Iniciais Padrão (caso esteja vazio)
        const initialData = [
            { id: 1, materia: "Direito Constitucional - Teoria Geral", status: "Concluído", horas: 4 },
            { id: 2, materia: "Legislação Institucional - MPMG", status: "Em Estudo", horas: 2 },
            { id: 3, materia: "Direito Administrativo - Licitações", status: "Pendente", horas: 0 }
        ];

        function getStoredData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : initialData;
        }

        function saveStoredData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            render();
        }

        function render() {
            const data = getStoredData();
            const tbody = document.getElementById('topicsTableBody');
            tbody.innerHTML = '';

            let concluidos = 0;

            data.forEach(item => {
                if (item.status === 'Concluído') concluidos++;

                let badgeClass = 'badge-pendente';
                if (item.status === 'Em Estudo') badgeClass = 'badge-estudando';
                if (item.status === 'Concluído') badgeClass = 'badge-concluido';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(item.materia)}</strong></td>
                    <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    <td>${item.horas} h</td>
                    <td>
                        <button class="action-btn" onclick="deleteTopic(${item.id})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Atualiza Estatísticas
            const total = data.length;
            const progresso = total > 0 ? Math.round((concluidos / total) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statConcluidos').innerText = concluidos;
            document.getElementById('statProgresso').innerText = `${progresso}%`;
        }

        function addTopic(e) {
            e.preventDefault();
            const materia = document.getElementById('materiaInput').value.trim();
            const status = document.getElementById('statusSelect').value;
            const horas = parseFloat(document.getElementById('horasInput').value) || 0;

            if (!materia) return;

            const data = getStoredData();
            data.push({
                id: Date.now(),
                materia,
                status,
                horas
            });

            saveStoredData(data);
            document.getElementById('studyForm').reset();
        }

        function deleteTopic(id) {
            let data = getStoredData();
            data = data.filter(item => item.id !== id);
            saveStoredData(data);
        }

        function clearAllData() {
            if (confirm("Tem certeza que deseja apagar todos os registros de estudos?")) {
                localStorage.removeItem(STORAGE_KEY);
                render();
            }
        }

        // Exportar Dados para Arquivo JSON
        function exportData() {
            const data = getStoredData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "backup_estudos_mpmg.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Importar Arquivo JSON (Funciona em PC e Smartphone)
        function importData(event) {
            const fileReader = new FileReader();
            const file = event.target.files[0];

            if (!file) return;

            fileReader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        saveStoredData(importedData);
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Formato de arquivo inválido!");
                    }
                } catch (err) {
                    alert("Erro ao ler o arquivo JSON.");
                }
            };

            fileReader.readAsText(file);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Renderiza na inicialização
        render();
    </script>
</body>
</html>
